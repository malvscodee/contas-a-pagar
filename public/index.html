<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contas a Pagar</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><text y=%22.9em%22 font-size=%2220%22>💰</text></svg>">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
    <div class="splash-screen" id="splashScreen"><div class="loader"></div></div>
    <div class="app-content" id="mainView">
        <div class="container">
            <div class="header">
                <div class="header-left">
                    <h1>Contas a Pagar</h1>
                </div>
                <div style="display: flex; gap: 0.75rem;">
                    <button class="btn-new-order-header" data-action="new-conta">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        Nova Conta
                    </button>
                </div>
            </div>

            <div class="dashboard-grid">
                <div class="stat-card stat-card-success"><div class="stat-icon stat-icon-success"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg></div><div class="stat-content"><div class="stat-value stat-value-success" id="statPagos">R$ 0,00</div><div class="stat-label">Pagos</div></div></div>
                <div class="stat-card stat-card-danger" id="cardVencido" onclick="window.showVencidoModal()" style="cursor:pointer;position:relative;" title="Clique para ver detalhes"><span class="pulse-badge" id="pulseBadge" style="display:none;"></span><div class="stat-icon stat-icon-danger"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg></div><div class="stat-content"><div class="stat-value stat-value-danger" id="statVencido">0</div><div class="stat-label">Vencido</div></div></div>
                <div class="stat-card stat-card-warning"><div class="stat-icon stat-icon-warning"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg></div><div class="stat-content"><div class="stat-value stat-value-warning" id="statPendente">R$ 0,00</div><div class="stat-label">Pendente</div></div></div>
                <div class="stat-card"><div class="stat-icon stat-icon-default"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg></div><div class="stat-content"><div class="stat-value" id="statValorTotal">R$ 0,00</div><div class="stat-label">Valor Total</div></div></div>
            </div>

            <div class="search-bar-wrapper"><div class="search-bar">
                <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35"></path></svg>
                <input type="text" id="search" placeholder="Pesquisar" oninput="filterContas()">
                <div class="search-bar-filters">
                    <div class="filter-dropdown-inline"><select id="filterBanco" onchange="filterContas()"><option value="">Todos os Bancos</option></select><svg class="dropdown-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg></div>
                    <div class="filter-dropdown-inline"><select id="filterPagamento" onchange="filterContas()"><option value="">Todas Formas</option></select><svg class="dropdown-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg></div>
                    <div class="filter-dropdown-inline"><select id="filterStatus" onchange="filterContas()"><option value="">Todos os Status</option></select><svg class="dropdown-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg></div>
                    <div class="month-navigation-inline">
                        <button onclick="window.changeMonth(-1)" class="month-nav-arrow" title="Mês anterior"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
                        <div class="month-display-inline"><span id="currentMonth">Carregando...</span></div>
                        <button onclick="window.changeMonth(1)" class="month-nav-arrow" title="Próximo mês"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
                    </div>
                </div>
                <button class="calendar-btn" onclick="window.gerarPDF()" title="Gerar PDF">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                </button>
                <button class="calendar-btn" onclick="window.toggleCalendar()" title="Selecionar mês"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg></button>
                <button class="calendar-btn" onclick="window.sincronizarDados()" title="Sincronizar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg></button>
            </div></div>

            <div class="calendar-modal" id="calendarModal">
                <div class="calendar-content"><div class="calendar-header"><button onclick="window.changeCalendarYear(-1)" class="calendar-year-nav"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg></button><h3 id="calendarYear">2026</h3><button onclick="window.changeCalendarYear(1)" class="calendar-year-nav"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg></button></div><div class="calendar-months" id="calendarMonths"></div></div>
            </div>

            <div class="card table-card"><div id="contasContainer"></div></div>
        </div>
    </div>

    <div class="modal-overlay" id="vencidoModal" style="display:none;"><div class="modal-content alert-modal"><div class="modal-header-alert"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#EF4444" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg><button class="close-modal" onclick="window.closeVencidoModal()">✕</button></div><div class="modal-body" id="vencidoModalBody"></div><div class="modal-actions-alert"><button type="button" onclick="window.closeVencidoModal()" class="btn-close-red">Fechar</button></div></div></div>

    <script>setTimeout(() => { const s = document.getElementById('splashScreen'); if(s) s.style.display='none'; }, 3000);</script>
    <script src="script.js"></script>
    <script src="calendar.js"></script>
</body>
</html>
